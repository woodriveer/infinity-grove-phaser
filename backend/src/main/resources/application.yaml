spring:
  application:
    name: infinity-grove-ws
  datasource:
    url: jdbc:postgresql://localhost:5432/infinity_grove
    username: infinity
    password: infinity
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
# no default: startup fails when JWT_SECRET is missing or shorter than 32 bytes
app:
  security:
    jwt-secret: ${JWT_SECRET}
  wallet:
    # one entry per monster level: copper per kill (min..max) and the fastest honest time between kills
    drop-table:
      - level: 1
        min-copper: 1
        max-copper: 5
        kill-interval-ms: 1500
