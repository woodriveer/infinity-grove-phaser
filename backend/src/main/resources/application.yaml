spring:
  application:
    name: infinity-grove-ws
  datasource:
    url: jdbc:postgresql://localhost:5432/infinity_grove
    username: infinity
    password: infinity
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
# no default: startup fails when JWT_SECRET is missing or shorter than 32 bytes
app:
  security:
    jwt-secret: ${JWT_SECRET}
  wallet:
    # one entry per monster level: copper per kill (min..max) and the fastest honest time between kills
    drop-table:
      - level: 1
        min-copper: 1
        max-copper: 5
        kill-interval-ms: 1500
  cards:
    # miniboss chance per stage (stage n drops a hero card at n times it: 2 % to 20 % over a chapter), chance a repeated chapter
    # boss win does (the first win always does), chapter boss wins counted per UTC day, and the shortest time between two farm wins
    miniboss-rate-per-stage: 0.02
    chapter-boss-rate: 0.30
    chapter-boss-daily-limit: 10
    farm-min-interval-ms: 5000
