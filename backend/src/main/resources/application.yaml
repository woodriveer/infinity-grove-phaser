spring:
  application:
    name: infinity-grove-ws
  datasource:
    url: jdbc:postgresql://localhost:5432/infinity_grove
    username: infinity
    password: infinity
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration); Hibernate only checks the entities against it
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
# no default: startup fails when JWT_SECRET is missing or shorter than 32 bytes
app:
  security:
    jwt-secret: ${JWT_SECRET}
  cards:
    # miniboss chance per stage (stage n drops a hero card at n times it: 7 % to 70 % over a chapter), chance a repeated chapter
    # boss win does (the first win always does), chapter boss wins counted per UTC day, and the shortest time between two farm wins
    miniboss-rate-per-stage: 0.07
    chapter-boss-rate: 0.80
    chapter-boss-daily-limit: 10
    farm-min-interval-ms: 5000
  equipment:
    # chance a won miniboss / chapter boss drops a piece, pieces the bag holds, copper to refine a COMMON piece from +0 (grows 1.7x per
    # level, times the rarity) and copper to reroll one affix
    miniboss-rate: 0.5
    chapter-boss-rate: 1.0
    bag-capacity: 100
    refine-base-cost: 500
    reroll-cost: 5000
