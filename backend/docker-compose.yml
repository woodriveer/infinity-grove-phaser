services:
  postgres:
    image: postgres:16
    container_name: infinity-grove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: infinity_grove
      POSTGRES_USER: infinity
      POSTGRES_PASSWORD: infinity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinity -d infinity_grove"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: infinity-grove-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@infinitygrove.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # Blue-green deploy (profile deploy): two backend slots behind the proxy, and Dozzle for the logs.
  # The slots and Dozzle bind to 127.0.0.1 only; the tunnel reaches the backend through the proxy.
  backend-blue:
    image: ${BLUE_IMAGE:-infinity-grove-backend:blue}
    container_name: infinity-grove-backend-blue
    profiles: [ deploy ]
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/infinity_grove
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend-green:
    image: ${GREEN_IMAGE:-infinity-grove-backend:green}
    container_name: infinity-grove-backend-green
    profiles: [ deploy ]
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/infinity_grove
      JWT_SECRET: ${JWT_SECRET:-}
    ports:
      - "127.0.0.1:18082:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # deploy/lib/proxy.mjs writes the active slot into /etc/traefik/dynamic from inside the container (a Windows bind mount
  # never wakes the file watcher) and Traefik hot-reloads it; the API on :8080 stays inside the container for that check
  proxy:
    image: traefik:v3.7.15
    container_name: infinity-grove-proxy
    profiles: [ deploy ]
    restart: unless-stopped
    command:
      - --entryPoints.web.address=:80
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --api.insecure=true
      - --accessLog=true
    ports:
      - "127.0.0.1:${PROXY_PORT:-8080}:80"
    volumes:
      - /etc/traefik/dynamic

  dozzle:
    image: amir20/dozzle:v11.3.5
    container_name: infinity-grove-dozzle
    profiles: [ deploy ]
    restart: unless-stopped
    environment:
      DOZZLE_FILTER: name=infinity-grove
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  postgres_data:
  pgadmin_data:
