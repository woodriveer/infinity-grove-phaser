<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Infinity Grove — Prólogo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05090a}
a{color:#e9d9a6}a:hover{color:#fff3cc}
.ig-stage{position:relative;width:1280px;height:720px;overflow:hidden;background:#05090a;font-family:'Cormorant Garamond',Georgia,serif;color:#f4ecd4}
.ig-layer{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease}
.ig-layer.on{opacity:1}
.ig-forest{background-image:url(/_blob/9e14c90a353ab5a53922963cc7022ad6);animation:igDrift 40s ease-in-out infinite alternate}
.ig-map{background-image:url(/_blob/0c3a0d0393d09694f43d98297eb58c14);animation:igPan 14s ease-in-out infinite alternate}
.ig-tint{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
.ig-tint.on{opacity:1}
.ig-dark{background:rgba(2,6,6,.55)}
.ig-red{background:radial-gradient(ellipse at 50% 55%,rgba(120,0,0,0) 20%,rgba(140,10,10,.55) 75%,rgba(60,0,0,.85) 100%);animation:igPulse 1.6s ease-in-out infinite}
.ig-gold{background:radial-gradient(ellipse at 50% 40%,rgba(255,214,120,.28),rgba(0,0,0,0) 60%)}
.ig-voice{background:radial-gradient(ellipse at 50% 30%,rgba(150,255,190,.22),rgba(0,0,0,0) 55%)}
.ig-vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.7) 100%)}
.ig-mote{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff2a8;box-shadow:0 0 10px 3px rgba(255,236,140,.7);animation:igFloat 9s ease-in-out infinite;pointer-events:none}
.ig-ghost{color:transparent;text-shadow:none}
.ig-narr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:940px;text-align:center;font-size:38px;line-height:1.45;font-style:italic;font-weight:500;text-shadow:0 2px 18px rgba(0,0,0,.95),0 0 4px rgba(0,0,0,.9);opacity:0;transition:opacity .6s ease}
.ig-narr.on{opacity:1}
.ig-narr-scrim{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1200px;height:420px;background:radial-gradient(ellipse at center,rgba(0,0,0,.6),rgba(0,0,0,0) 70%);pointer-events:none}
.ig-box{position:absolute;bottom:40px;background:linear-gradient(180deg,rgba(14,26,20,.92),rgba(8,16,12,.95));border:2px solid #c9a95a;border-radius:14px;box-shadow:0 0 0 4px rgba(10,18,14,.8),0 0 0 5px rgba(201,169,90,.45),0 18px 40px rgba(0,0,0,.6);padding:34px 40px 30px;box-sizing:border-box;font-size:32px;line-height:1.4;font-weight:500;animation:igRise .5s ease both}
.ig-name{position:absolute;top:-24px;left:32px;font-family:'Cinzel',serif;font-weight:700;font-size:20px;letter-spacing:.12em;color:#1b1406;background:linear-gradient(180deg,#f3dc95,#c9a24c);padding:8px 22px;border-radius:8px;border:1px solid #fff0bf;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.ig-next{position:absolute;right:22px;bottom:14px;animation:igBob 1s ease-in-out infinite}
.ig-sera{position:absolute;left:70px;bottom:0;height:560px;filter:drop-shadow(0 0 22px rgba(255,226,150,.45));animation:igEnter .8s ease both}
.ig-portrait{position:absolute;left:28px;top:-52px;width:156px;height:156px;border-radius:50%;object-fit:cover;border:3px solid #e8cf86;box-shadow:0 0 0 5px rgba(10,18,14,.9),0 0 22px rgba(255,220,140,.45),0 10px 24px rgba(0,0,0,.6);background:#0b140f}
.ig-orb{position:absolute;left:50%;top:150px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#ffffff 0%,#c9ffd9 18%,rgba(110,230,160,.55) 45%,rgba(60,180,120,0) 72%);animation:igBreath 2.6s ease-in-out infinite}
.ig-hit{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;background:transparent;cursor:pointer;z-index:5}
.ig-hit:focus-visible{outline:3px solid #f3dc95;outline-offset:-6px}
.ig-ui{position:absolute;top:22px;right:24px;z-index:6;display:flex;align-items:center;gap:16px}
.ig-dot{width:10px;height:10px;border-radius:50%;background:rgba(244,236,212,.25);border:1px solid rgba(244,236,212,.5)}
.ig-dot.on{background:#f3dc95;border-color:#f3dc95;box-shadow:0 0 8px rgba(243,220,149,.8)}
.ig-icon{width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,220,149,.6);background:rgba(8,16,12,.6);color:#f3dc95;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ig-icon:hover{background:rgba(30,50,38,.8)}
.ig-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.ig-logo{width:620px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));animation:igRise 1.2s ease both}
.ig-kicker{font-family:'Cinzel',serif;letter-spacing:.3em;font-size:16px;color:#e9d9a6;text-transform:uppercase;text-shadow:0 2px 8px #000}
.ig-cta{font-family:'Cinzel',serif;letter-spacing:.18em;font-size:18px;color:#fff3cc;text-shadow:0 0 12px rgba(255,220,140,.8),0 2px 6px #000;animation:igBlink 1.8s ease-in-out infinite}
.ig-endtitle{font-family:'Cinzel',serif;font-weight:700;font-size:56px;letter-spacing:.06em;color:#f3dc95;text-shadow:0 4px 24px rgba(0,0,0,.9);margin:0}
.ig-endsub{font-size:30px;font-style:italic;text-shadow:0 2px 12px #000;margin:0}
.ig-m0{left:608px;top:480px;animation-delay:1.04s;animation-duration:8.46s}
.ig-m1{left:550px;top:453px;animation-delay:0.71s;animation-duration:12.27s}
.ig-m2{left:731px;top:405px;animation-delay:2.56s;animation-duration:11.69s}
.ig-m3{left:815px;top:238px;animation-delay:4.49s;animation-duration:8.41s}
.ig-m4{left:833px;top:279px;animation-delay:5.04s;animation-duration:9.92s}
.ig-m5{left:218px;top:225px;animation-delay:8.45s;animation-duration:12.82s}
.ig-m6{left:150px;top:422px;animation-delay:8.60s;animation-duration:8.13s}
.ig-m7{left:520px;top:475px;animation-delay:6.05s;animation-duration:8.68s}
.ig-m8{left:211px;top:693px;animation-delay:4.01s;animation-duration:8.40s}
.ig-m9{left:678px;top:365px;animation-delay:1.38s;animation-duration:11.64s}
.ig-m10{left:436px;top:375px;animation-delay:0.72s;animation-duration:12.56s}
.ig-m11{left:296px;top:642px;animation-delay:4.24s;animation-duration:8.42s}
.ig-m12{left:748px;top:401px;animation-delay:6.83s;animation-duration:10.92s}
.ig-m13{left:169px;top:312px;animation-delay:4.05s;animation-duration:7.54s}
@keyframes igDrift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,-1%)}}
@keyframes igPan{from{transform:scale(1.05) translate(1.5%,0)}to{transform:scale(1.1) translate(-2%,-1%)}}
@keyframes igPulse{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes igFloat{0%{transform:translate(0,0);opacity:0}20%{opacity:1}80%{opacity:.8}100%{transform:translate(30px,-90px);opacity:0}}
@keyframes igRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes igEnter{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes igBreath{0%,100%{transform:scale(.92);opacity:.85}50%{transform:scale(1.08);opacity:1}}
@keyframes igBob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes igBlink{0%,100%{opacity:.45}50%{opacity:1}}
</style>
</helmet>
<div class="ig-stage">
  <div class="ig-layer ig-forest {{forestOn}}"></div>
  <div class="ig-layer ig-map {{mapOn}}"></div>
  <div class="ig-tint ig-dark {{darkOn}}"></div>
  <div class="ig-tint ig-red {{redOn}}"></div>
  <div class="ig-tint ig-gold {{goldOn}}"></div>
  <div class="ig-tint ig-voice {{voiceOn}}"></div>
  <sc-for list="{{motes}}" as="m" hint-placeholder-count="14">
    <span class="ig-mote {{m.cls}}"></span>
  </sc-for>
  <div class="ig-vignette"></div>

  <sc-if value="{{isTitle}}" hint-placeholder-val="{{ true }}">
    <div class="ig-center">
      <img class="ig-logo" src="/_blob/14499b2c564d15956d96940d8a659840" alt="Infinity Grove">
      <p class="ig-kicker" style="margin: 0">Ato 1 — Bosque Desperto · Prólogo</p>
      <p class="ig-cta" style="margin: 18px 0 0">Clique para começar</p>
    </div>
  </sc-if>

  <sc-if value="{{showNarr}}" hint-placeholder-val="{{ false }}">
    <div class="ig-narr-scrim"></div>
    <p class="ig-narr on" style="margin: 0">{{shown}}<span class="ig-ghost">{{rest}}</span></p>
    <sc-if value="{{showNext}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; left: 50%; bottom: 120px; margin-left: -14px" class="ig-next">
        <svg width="28" height="18" viewBox="0 0 28 18" aria-hidden="true"><path d="M3 3 L14 14 L25 3" fill="none" stroke="#f3dc95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </sc-if>
  </sc-if>

  <sc-if value="{{showVoice}}" hint-placeholder-val="{{ false }}">
    <div class="ig-orb"></div>
    <div class="ig-box" style="left: 210px; width: 860px; min-height: 160px">
      <span class="ig-name">{{speaker}}</span>
      <p style="margin: 0; font-style: italic">{{shown}}<span class="ig-ghost">{{rest}}</span></p>
      <sc-if value="{{showNext}}" hint-placeholder-val="{{ false }}">
        <div class="ig-next"><svg width="22" height="14" viewBox="0 0 28 18" aria-hidden="true"><path d="M3 3 L14 14 L25 3" fill="none" stroke="#f3dc95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{showSera}}" hint-placeholder-val="{{ false }}">
    <div class="ig-box" style="left: 110px; width: 1060px; min-height: 176px; padding: 36px 48px 30px 210px">
      <img class="ig-portrait" src="/_blob/58ff428d0eacd3e6e936828588282c04" alt="Seraphine">
      <span class="ig-name" style="left: 206px; top: -22px">{{speaker}}</span>
      <p style="margin: 0">{{shown}}<span class="ig-ghost">{{rest}}</span></p>
      <sc-if value="{{showNext}}" hint-placeholder-val="{{ false }}">
        <div class="ig-next"><svg width="22" height="14" viewBox="0 0 28 18" aria-hidden="true"><path d="M3 3 L14 14 L25 3" fill="none" stroke="#f3dc95" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></div>
      </sc-if>
    </div>
  </sc-if>

  <sc-if value="{{isEnd}}" hint-placeholder-val="{{ false }}">
    <div class="ig-center" style="background: rgba(2,6,6,.55)">
      <p class="ig-kicker" style="margin: 0">Fim do Prólogo</p>
      <h1 class="ig-endtitle">Ato 1 — Bosque Desperto</h1>
      <p class="ig-endsub">Capítulo 1</p>
      <p class="ig-cta" style="margin: 26px 0 0">Clique para assistir de novo</p>
    </div>
  </sc-if>

  <button class="ig-hit" type="button" aria-label="{{hitLabel}}" onClick="{{advance}}"></button>

  <div class="ig-ui">
    <sc-if value="{{isPlaying}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: 8px; align-items: center" aria-hidden="true">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
          <span class="ig-dot {{d.on}}"></span>
        </sc-for>
      </div>
    </sc-if>
    <button class="ig-icon" type="button" aria-label="{{muteLabel}}" onClick="{{toggleMute}}">
      <sc-if value="{{muted}}" hint-placeholder-val="{{ false }}">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 L6 9 H3 v6 h3 l5 4 z"></path><path d="M17 9 l5 6"></path><path d="M22 9 l-5 6"></path></svg>
      </sc-if>
      <sc-if value="{{unmuted}}" hint-placeholder-val="{{ true }}">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 L6 9 H3 v6 h3 l5 4 z"></path><path d="M15.5 8.5 a5 5 0 0 1 0 7"></path><path d="M18.5 5.5 a9 9 0 0 1 0 13"></path></svg>
      </sc-if>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"autoDelay":{"editor":"range","min":0,"max":4,"step":0.1,"unit":"s","default":1.2},"$preview":{"width":1280,"height":720}}'>
var IG_LINES = [
  { speaker: 'Narrador', kind: 'narr', scene: 'forest', dur: 12.36, audio: '/_blob/d354f5be62f7791fe0f96b2ab7593c13',
    cues: [[0.05, 3.51, 'Eldora sempre respirou pela Grande Árvore.'], [4.11, 6.73, 'Suas raízes bebem do fundo do mundo,'], [7.25, 9.65, 'e sua seiva corre por cada folha,'], [10.0, 10.7, 'cada rio,'], [11.15, 12.2, 'cada criatura.']] },
  { speaker: 'Narrador', kind: 'narr', scene: 'dark', dur: 3.47, audio: '/_blob/45180c47bca901eba70d4262c8a67d24',
    cues: [[0.05, 2.23, 'Até a noite em que as raízes'], [2.6, 3.4, 'tremeram.']] },
  { speaker: 'Narrador', kind: 'narr', scene: 'red', redAt: 6.1, dur: 7.47, audio: '/_blob/34d402d1ce0c3d4314be9238d0492b15',
    cues: [[0.05, 2.28, 'Do fundo da terra subiu um rumor.'], [2.98, 5.24, 'E os animais do bosque abriram os olhos...'], [6.23, 7.3, 'Vermelhos.']] },
  { speaker: 'Narrador', kind: 'narr', scene: 'map', dur: 6.11, audio: '/_blob/dffc553af8cd2ddf0add8ceb13b7cdc7',
    cues: [[0.05, 1.53, 'A Árvore despertou.'], [2.08, 3.66, 'E, entre milhares,'], [4.06, 6.0, 'escolheu cinco guardiões.']] },
  { speaker: 'A Voz', kind: 'voice', scene: 'voice', dur: 4.05, audio: '/_blob/038ddd8a7fc2ed51970e47ea70bda394',
    cues: [[0.05, 1.03, 'Criança...'], [1.39, 2.04, 'venha.'], [2.57, 3.9, 'Eu preciso de você.']] },
  { speaker: 'Seraphine', kind: 'sera', scene: 'forest', dur: 6.35, audio: '/_blob/b6746d723ba15a98056c52b6d5a240d4',
    cues: [[0.05, 1.46, 'Vocês também ouviram?'], [2.1, 3.4, 'Ela está nos chamando.'], [4.02, 4.82, 'A Árvore...'], [5.19, 6.2, 'está com medo.']] }
];
IG_LINES.forEach(function (l) { l.text = l.cues.map(function (c) { return c[2]; }).join(' '); });

var IG_MOTES = [];
for (var mi = 0; mi < 14; mi++) IG_MOTES.push({ cls: 'ig-m' + mi });

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'title', idx: 0, n: 0, mode: 'playing', t: 0, muted: false };
    this.raf = null;
    this.timer = null;
    this.audios = [];
    this.clockStart = 0;
    this.useClock = false;
  }

  componentDidMount() {
    try {
      this.audios = IG_LINES.map(function (l) { var a = new Audio(l.audio); a.preload = 'auto'; return a; });
    } catch (e) { this.audios = []; }
  }

  componentWillUnmount() { this.stopAll(); }

  stopAll() {
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    if (this.timer) clearTimeout(this.timer);
    this.timer = null;
    this.audios.forEach(function (a) { try { a.pause(); a.onended = null; } catch (e) {} });
  }

  charsAt(line, t) {
    var n = 0;
    for (var i = 0; i < line.cues.length; i++) {
      var c = line.cues[i], len = c[2].length + (i < line.cues.length - 1 ? 1 : 0);
      if (t >= c[1]) n += len;
      else if (t > c[0]) { n += Math.floor(len * (t - c[0]) / (c[1] - c[0])); break; }
      else break;
    }
    return Math.min(n, line.text.length);
  }

  play(i) {
    var self = this;
    this.stopAll();
    var line = IG_LINES[i];
    this.setState({ phase: 'play', idx: i, n: 0, mode: 'playing', t: 0 });
    var a = this.audios[i];
    this.useClock = false;
    this.clockStart = performance.now();
    if (a) {
      try {
        a.currentTime = 0;
        a.muted = this.state.muted;
        a.onended = function () { self.finish(true); };
        var p = a.play();
        if (p && p.catch) p.catch(function () { self.useClock = true; self.clockStart = performance.now(); });
      } catch (e) { this.useClock = true; }
    } else { this.useClock = true; }
    var tick = function () {
      var t = self.useClock || !a ? (performance.now() - self.clockStart) / 1000 : a.currentTime;
      if (self.useClock && t >= line.dur) { self.finish(true); return; }
      self.setState({ n: self.charsAt(line, t), t: t });
      self.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }

  finish(auto) {
    var line = IG_LINES[this.state.idx];
    if (this.raf) cancelAnimationFrame(this.raf);
    this.raf = null;
    var a = this.audios[this.state.idx];
    if (a) { try { a.pause(); a.onended = null; } catch (e) {} }
    this.setState({ n: line.text.length, mode: 'complete', t: line.dur });
    if (auto) {
      var self = this;
      var d = this.props.autoDelay != null ? this.props.autoDelay : 1.2;
      if (this.timer) clearTimeout(this.timer);
      this.timer = setTimeout(function () { self.timer = null; self.next(); }, d * 1000);
    }
  }

  next() {
    if (this.timer) { clearTimeout(this.timer); this.timer = null; }
    var i = this.state.idx + 1;
    if (i < IG_LINES.length) this.play(i);
    else { this.stopAll(); this.setState({ phase: 'end' }); }
  }

  advance() {
    var s = this.state;
    if (s.phase === 'title' || s.phase === 'end') { this.play(0); return; }
    if (s.mode === 'playing') this.finish(false);
    else this.next();
  }

  toggleMute() {
    var m = !this.state.muted;
    this.audios.forEach(function (a) { a.muted = m; });
    this.setState({ muted: m });
  }

  renderVals() {
    var s = this.state;
    var playing = s.phase === 'play';
    var line = IG_LINES[s.idx];
    var scene = playing ? line.scene : (s.phase === 'end' ? 'forest' : 'forest');
    var text = playing ? line.text : '';
    var redOn = playing && scene === 'red' && (s.t >= (line.redAt || 0) || s.mode === 'complete');
    return {
      advance: () => this.advance(),
      toggleMute: () => this.toggleMute(),
      motes: IG_MOTES,
      forestOn: scene === 'map' ? '' : 'on',
      mapOn: scene === 'map' ? 'on' : '',
      darkOn: (s.phase === 'title' || scene === 'dark' || scene === 'red' || scene === 'voice') ? 'on' : '',
      redOn: redOn ? 'on' : '',
      goldOn: scene === 'map' ? 'on' : '',
      voiceOn: scene === 'voice' ? 'on' : '',
      isTitle: s.phase === 'title',
      isEnd: s.phase === 'end',
      isPlaying: playing,
      showNarr: playing && line.kind === 'narr',
      showVoice: playing && line.kind === 'voice',
      showSera: playing && line.kind === 'sera',
      speaker: playing ? line.speaker : '',
      shown: text.slice(0, s.n),
      rest: text.slice(s.n),
      showNext: playing && s.mode === 'complete',
      dots: IG_LINES.map(function (l, i) { return { on: i <= s.idx && playing ? 'on' : '' }; }),
      hitLabel: s.phase === 'play' ? (s.mode === 'playing' ? 'Mostrar fala completa' : 'Próxima fala') : 'Começar a história',
      muted: s.muted,
      unmuted: !s.muted,
      muteLabel: s.muted ? 'Ativar som' : 'Silenciar'
    };
  }
}
</script>
